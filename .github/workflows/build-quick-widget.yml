name: Build MDS Timesheet app and watch APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'quick-widget/**'
      - '.github/workflows/build-quick-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quick-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use the MDS signing key
        env:
          KEYSTORE_B64: ${{ secrets.MDS_SIGNING_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mds.keystore"
            echo "MDS_KEYSTORE_PATH=$RUNNER_TEMP/mds.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::MDS_SIGNING_KEYSTORE secret is not set, so these APKs use a throwaway key and won't install over earlier builds."
          fi
      - name: Build and test
        run: gradle testDebugUnitTest assembleDebug
      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mds-timesheet.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk mds-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mds-timesheet-app
          path: quick-widget/mds-timesheet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mds-watch-log
          path: quick-widget/mds-watch.apk
      # The app checks the latest release for updates. Only signed builds from main are released,
      # so every release installs over the one before.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.MDS_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$((GITHUB_RUN_NUMBER + 100))
          gh release create "app-v$VERSION" mds-timesheet.apk mds-watch.apk \
            --title "MDS Timesheet app $VERSION" \
            --notes "Phone app: mds-timesheet.apk (updates itself from the app). Watch app: mds-watch.apk (install with Wear Installer 2)." \
            --latest
