name: Build Quick Timesheet Widget and Watch APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'quick-widget/**'
      - '.github/workflows/build-quick-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quick-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use the MDS signing key
        env:
          KEYSTORE_B64: ${{ secrets.MDS_SIGNING_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mds.keystore"
            echo "MDS_KEYSTORE_PATH=$RUNNER_TEMP/mds.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::MDS_SIGNING_KEYSTORE secret is not set, so these APKs use a throwaway key and won't install over earlier builds."
          fi
      - name: Build test APK
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mds-quick-widget-test
          path: quick-widget/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mds-watch-log
          path: quick-widget/wear/build/outputs/apk/debug/wear-debug.apk
