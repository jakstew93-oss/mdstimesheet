name: Build Quick Timesheet Widget APK

on:
  push:
    branches: [ quick-timesheet-widget ]
    paths:
      - 'quick-widget/**'
      - '.github/workflows/build-quick-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quick-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mds-quick-widget-test
          path: quick-widget/app/build/outputs/apk/debug/app-debug.apk
