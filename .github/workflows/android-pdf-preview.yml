name: Android PDF preview test

on:
  push:
    branches:
      - android-pdfjs-preview
    paths:
      - tools/enable-android-pdf-preview.mjs
      - .github/workflows/android-pdf-preview.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-pdfjs-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable and validate Android PDF preview
        run: node tools/enable-android-pdf-preview.mjs index.html Index.html
      - name: Commit generated app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Index.html
          git commit -m "Enable PDF.js preview on Android"
          git push
